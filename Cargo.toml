[package]
name = "splitfire-agent"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Music-domain ACP agent: theory, production, industry, culture and live shows, backed by any OpenAI-compatible chat completions API"
repository = "https://github.com/splitfireai/splitfire-agent"

[dependencies]
agent-client-protocol = "2.2"
anyhow = "1.0.104"
base64 = "0.23.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
ebur128 = "0.1.10"
futures = "0.3.34"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
realfft = "3.5.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
rmcp = { version = "3.5.1", default-features = false, features = ["client", "transport-child-process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm", "aac", "isomp4", "aiff", "alac", "mkv"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4"] }

[dev-dependencies]
hound = "3.5.1"
